name: Docker PR Check

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  dive-check:
    name: Dive image efficiency check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t ecr-token:pr-check .

      - name: Run dive
        run: CI=true ./dive ecr-token:pr-check
